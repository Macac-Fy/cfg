// CS2 autoexec.cfg｜按功能分类整理
// 启动项：+exec autoexec.cfg -worldwide -freq 200

// ============================================================================
// 01｜画面与帧率
// ============================================================================
fps_max "0"										// 游戏内 FPS 上限（0=不限制）
fps_max_ui "200"									// 菜单/主界面 FPS 上限（0=不限制）
r_fullscreen_gamma "2.2"							// 全屏 Gamma；数值越低画面越亮

// ============================================================================
// 02｜网络与匹配
// ============================================================================
mm_dedicated_search_maxping "50"				// 官匹搜索服务器最大期望延迟，单位 ms
rate "786432"									// 客户端接收数据的带宽上限，单位字节/秒；786432=768 KiB/s，并非实际固定流量
cl_net_buffer_ticks "0"							// 额外网络缓冲 Tick 数（0~2）；缓冲可抵御丢包/抖动，同时增加延迟；当前为 0

// ============================================================================
// 03｜鼠标与操作方式
// ============================================================================
sensitivity "0.5"									// 游戏内鼠标灵敏度
zoom_sensitivity_ratio "0.818"						// 开镜鼠标灵敏度倍率；0.818 为个人设置，并非所有倍率通用的等效换算值
sensitivity_y_scale "1"								// 垂直鼠标灵敏度缩放；1=不额外缩放
option_duck_method "0"							// 蹲下方式（0=按住；1=切换）
option_speed_method "0"						// 静步方式（0=按住；1=切换）

// ============================================================================
// 04｜游戏交互与武器行为
// ============================================================================
cl_autohelp "0"									// 自动帮助提示（0=关闭；1=开启）
cl_use_opens_buy_menu "0"						// 在购买区按 E 打开购买菜单（0=关闭；1=开启）
cl_silencer_mode "0"								// 消音器拆卸方式（0=禁止拆卸；1=允许按辅助攻击键拆卸）
cl_sniper_auto_rezoom "1"						// 狙击枪开枪后自动重新开镜（0=关闭；1=开启）
r_drawtracers_firstperson "1"						// 第一人称曳光/弹道视觉（0=隐藏；1=显示）

// ============================================================================
// 05｜HUD、队伍与观战
// ============================================================================
safezonex "0.95"									// HUD 水平安全区比例；数值越小，左右界面元素越靠近屏幕中心
safezoney "0.95"									// HUD 垂直安全区比例；数值越小，上下界面元素越靠近屏幕中心
cl_hud_color "6"									// HUD 颜色预设；6=红色
hud_showtargetid "1"								// 准星指向玩家时显示名字/目标信息（0=关闭；1=开启）
cl_draw_only_deathnotices "0"						// 隐藏大部分 HUD、保留击杀通知（0=正常显示；1=启用精简显示）
cl_showloadout "0"								// 装备栏常显（0=非活动时隐藏；1=始终显示）
cl_color "3"										// 首选队友识别颜色；3=橙色（实际分配可能受队伍占用影响）
cl_teammate_colors_show "1"						// 队友颜色（0=关闭；1=颜色；2=颜色+字母）
cl_teamcounter_playercount_instead_of_avatars "0"	// 顶部队伍信息（0=头像；1=存活人数）
cl_show_observer_crosshair "2"					// 显示被观战玩家的准星（0=关闭；1=仅好友/组队成员；2=所有玩家）

// ============================================================================
// 06｜性能与网络遥测
// ============================================================================
cl_showfps "0"									// 屏幕顶部帧率信息（0=关闭；1=FPS；2=平滑 FPS；3=服务器毫秒数；4=FPS 并写入日志）
cl_showpos "0"									// 位置/速度等调试信息（0=关闭；1=显示）；开启受 sv_cheats 限制
cl_hud_telemetry_frametime_show "2"				// 帧时间/FPS 遥测（0=关闭；1=性能不佳时；2=常显）
cl_hud_telemetry_ping_show "2"					// 网络延迟遥测（0=关闭；1=网络不佳时；2=常显）
cl_hud_telemetry_net_misdelivery_show "2"			// 网络交付异常比例遥测，包含丢失、迟到等情况（0=关闭；1=异常时；2=常显）
cl_hud_telemetry_net_quality_graph_show "1"		// 网络抖动及数据丢失/乱序图（0=关闭；1=网络不佳时；2=常显）
cl_hud_telemetry_net_detailed "0"					// 详细网络质量信息，细分丢失、迟到与峰值抖动（0=关闭；1=网络不佳时；2=常显）
cl_hud_telemetry_serverrecvmargin_graph_show "0"	// 用户命令到达服务器的时间余量图（0=关闭；1=命令队列异常时；2=常显）

// ============================================================================
// 07｜雷达
// ============================================================================
cl_radar_scale "0.35"								// 雷达地图缩放；数值越小，可见地图范围越大
cl_hud_radar_scale "1.2"							// HUD 中雷达整体大小
cl_radar_icon_scale_min "0.4"						// 雷达玩家图标最小尺寸
cl_radar_always_centered "0"						// 雷达始终以玩家为中心（0=否；1=是）
cl_radar_rotate "1"								// 雷达随玩家视角旋转（0=固定北向；1=随视角旋转）
cl_radar_square_with_scoreboard "0"				// 打开计分板时切换方形雷达（0=否；1=是）
cl_hud_radar_background_alpha "1"				// 雷达背景透明度（0 = 完全透明；1 = 完全不透明；0.5 = 半透明）
cl_hud_radar_map_additive "0"					// 雷达地图使用叠加混合（0=关闭；1=开启）；显示效果受背景与场景亮度影响

// ============================================================================
// 08｜持枪视角
// ============================================================================
viewmodel_presetpos "2"							// 持枪视角预设；2=Classic
viewmodel_fov "68"								// 武器模型视野角度；常用范围 60-68
viewmodel_offset_x "2.5"							// 武器模型左右偏移；正值向右，负值向左
viewmodel_offset_y "1"							// 武器模型前后偏移；正值向前，负值向后
viewmodel_offset_z "-2"							// 武器模型上下偏移；正值向上，负值向下

// ============================================================================
// 09｜准星与瞄准镜
// ============================================================================
cl_crosshairstyle "4"								// 准星样式；4=静态十字准星
cl_crosshair_length "4"							// 准星线段长度；像素尺寸随屏幕分辨率缩放
cl_crosshair_thickness "2"							// 准星线条粗细；像素尺寸随屏幕分辨率缩放
cl_crosshair_gap "2"								// 准星中心与线段之间的间距偏移
cl_crosshaircolor_r "0"							// 准星红色分量
cl_crosshaircolor_g "255"							// 准星绿色分量
cl_crosshaircolor_b "255"							// 准星蓝色分量；RGB=0,255,255，为青色
cl_crosshaircolor_a "255"							// 准星透明度；255=完全不透明
cl_crosshair_drawoutline "0"						// 准星描边（0=关闭；1=完整描边；2=半描边）
cl_crosshairdot "0"								// 中心点（0=关闭；1=开启）
cl_crosshair_t "0"									// T 型准星（0=关闭；1=开启）
cl_crosshair_recoil "0"								// 准星跟随后坐力（0=关闭；1=开启）
cl_crosshair_friendly_warning "0"					// 友军准星警告（0=关闭；1=开启）
cl_ironsight_dot_scale "1"							// 带瞄具武器开镜时的圆点准星缩放比例
cl_ironsight_usecrosshaircolor "0"					// 带瞄具武器开镜时的圆点使用自定义准星颜色（0=否；1=是）
cl_crosshair_sniper_width "2"						// 狙击镜十字线宽度
cl_sniper_show_inaccuracy "0"						// 狙击镜通过模糊等视觉反馈显示当前不精确度（0=关闭；1=开启）

// ============================================================================
// 10｜声音与通信
// ============================================================================
volume "0.81"									// 主音量控制值（0~1）；当前为 0.81，不直接标注为菜单百分比
snd_headphone_eq "1"							// 耳机均衡器（0=Natural；1=Crisp；2=Smooth）
snd_spatialize_lerp "0"							// 声音空间化混合参数，对应菜单中的左右声道隔离设置；当前为 0
snd_mute_losefocus "1"							// 游戏失去焦点时静音（0=继续播放；1=静音）
cl_mute_all_but_friends_and_party "0"				// 限制好友和组队成员之外的通信（0=关闭；1=仅非竞技模式限制；2=所有模式限制）

// ============================================================================
// 11｜音乐音量
// ============================================================================
snd_menumusic_volume "0.09"					// 主菜单音乐音量控制值（0~1）；当前为 0.09
snd_roundstart_volume "0"						// 回合开始音乐
snd_roundend_volume "0"						// 回合结束音乐
snd_roundaction_volume "0"						// 回合行动音乐
snd_mvp_volume "0.024"							// MVP 音乐音量控制值（0~1）；当前为 0.024
snd_mapobjective_volume "0"						// 地图目标相关音乐
snd_tensecondwarning_volume "0.024"				// 炸弹倒计时最后约 10 秒的警告音乐音量；当前为 0.024
snd_deathcamera_volume "0"						// 死亡镜头音乐
snd_mute_mvp_music_live_players "1"				// 双方队伍均仍有玩家存活时静音 MVP 音乐（0=否；1=是）

// ============================================================================
// 12｜客户端命中预测效果
// ============================================================================
// 以下三项仅控制客户端预测视觉效果，不改变服务器最终命中判定。
cl_predict_body_shot_fx "0"						// 预测身体命中特效（0=关闭；1=开启）
cl_predict_head_shot_fx "0"						// 预测爆头特效（0=关闭；1=开启）
cl_predict_kill_ragdolls "0"						// 预测击杀布娃娃效果（0=关闭；1=开启）

// ============================================================================
// 13｜控制台与调试
// ============================================================================
developer "0"									// 开发者调试输出级别；0=关闭，非零值启用相应调试输出
con_enable "1"									// 开发者控制台（0=关闭；1=开启）

// ============================================================================
// 14｜解除所有绑键
// ============================================================================
unbindall										// 清除所有键位绑定，再按以下配置重新绑定

// ============================================================================
// 15｜键位：鼠标移动
// ============================================================================
bind "MOUSE_X" "yaw"							// 鼠标水平移动：左右转动视角
bind "MOUSE_Y" "pitch"							// 鼠标垂直移动：上下转动视角

// ============================================================================
// 16｜键位：移动
// ============================================================================
bind "w" "+forward"								// W：前进
bind "a" "+left"									// A：左移
bind "s" "+back"									// S：后退
bind "d" "+right"									// D：右移
bind "Ctrl" "+duck"								// Ctrl：下蹲
bind "Shift" "+sprint"								// Shift：静步
bind "SPACE" "+jump"							// SPACE：跳跃
bind "MWHEELDOWN" "+jump"					// 鼠标滚轮向下：跳跃

// ============================================================================
// 17｜键位：武器与交互
// ============================================================================
bind "1" "slot1"									// 1：主武器
bind "2" "slot2"									// 2：副武器
bind "3" "slot3"									// 3：匕首
bind "4" "slot4"									// 4：切换投掷物
bind "5" "slot5"									// 5：c4
bind "c" "slot7"									// C：切出闪光弹
bind "MOUSE5" "slot8"							// 鼠标侧键 5：切出烟雾弹
bind "MOUSE1" "+attack"							// 鼠标左键：主要攻击
bind "MOUSE2" "+attack2"						// 鼠标右键：辅助攻击
bind "q" "lastinv"									// Q：切换至上一个武器
bind "r" "+reload"								// R：换弹
bind "e" "+use"									// E：使用 / 交互 / 拆除炸弹
bind "f" "+lookatweapon"							// F：检视武器
bind "g" "drop"									// G：丢弃当前武器
bind "z" "switchhands"							// Z：切换左右持枪手

// ============================================================================
// 18｜键位：菜单与通信
// ============================================================================
bind "b" "buymenu"								// B：打开购买菜单
bind "l" "toggleconsole"							// L：打开/关闭控制台
bind "m" "teammenu"							// M：选择阵营
bind "TAB" "+showscores"						// TAB：打开计分板
bind "x" "toggle cl_radar_scale 0.35 1"				// X：切换雷达地图缩放；按一下放大至 1，再按一下恢复 0.35
bind "Escape" "cancelselect"						// ESC：取消当前选择 / 菜单操作
bind "t" "+spray_menu"							// T：喷漆菜单
bind "y" "messagemode"							// Y：全部聊天
bind "u" "messagemode2"						// U：队伍聊天
bind "MOUSE3" "player_ping"						// 鼠标中键：标记
bind "MOUSE4" "+voicerecord"					// 鼠标侧键 4：按住进行语音通话

// ============================================================================
// 19｜键位：平台插件命令
// ============================================================================
bind "h" "say_team .drop"							// H：向队伍聊天发送 .drop；需服务器插件支持，实际功能由平台定义
bind "p" "say_team .pause"						// P：向队伍聊天发送 .pause；需服务器插件支持，通常用于请求暂停
